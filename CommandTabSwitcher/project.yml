name: CommandTabSwitcher

options:
  bundleIdPrefix: com.irfanaksu
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: CommandTabSwitcher
    PRODUCT_BUNDLE_IDENTIFIER: com.irfanaksu.CommandTabSwitcher
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0

targets:
  CommandTabSwitcher:
    type: application
    platform: macOS
    deploymentTarget: "13.0"

    sources:
      - path: CommandTabSwitcher
        excludes:
          - Resources

      - path: CommandTabSwitcher/Resources/Assets.xcassets
        buildPhase: resources

    info:
      path: CommandTabSwitcher/Resources/Info.plist

    entitlements:
      path: CommandTabSwitcher/Resources/CommandTabSwitcher.entitlements

    settings:
      base:
        PRODUCT_NAME: CommandTabSwitcher
        PRODUCT_BUNDLE_IDENTIFIER: com.irfanaksu.CommandTabSwitcher

        INFOPLIST_FILE: CommandTabSwitcher/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: CommandTabSwitcher/Resources/CommandTabSwitcher.entitlements

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO

schemes:
  CommandTabSwitcher:
    build:
      targets:
        CommandTabSwitcher: all

    run:
      config: Debug

    archive:
      config: Release
